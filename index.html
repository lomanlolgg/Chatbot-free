<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Botty – chatbot with a brain</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#77756e;--me:#3b5bdb;--meText:#fff;--bot:#ecebe5;--line:#e0ded6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--text:#ecebe5;--muted:#8d8b83;--me:#5c7cfa;--bot:#2a2a27;--line:#33332f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--text:#ecebe5;--muted:#8d8b83;--me:#5c7cfa;--bot:#2a2a27;--line:#33332f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;background:var(--card);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--me);color:var(--meText);display:grid;place-items:center;font-weight:700}
.ttl{flex:1;font-weight:600;line-height:1.2}
.ttl small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.ib{border:0;background:transparent;color:var(--muted);font-size:18px;padding:6px 8px;border-radius:8px;cursor:pointer}
.ib:hover{background:var(--bot)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:18px;width:min(340px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog input{display:block;width:100%;margin:8px 0}
dialog button{border:1px solid var(--line);background:var(--bot);color:var(--text);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;margin:4px 4px 0 0}
dialog .lk{border:0;background:none;color:var(--muted);text-decoration:underline}
#lmsg{min-height:20px;font-size:13px;color:var(--muted)}
.mode{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:5px 6px;font-size:13px;max-width:104px}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.m{max-width:82%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bot{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
.me{background:var(--me);color:var(--meText);align-self:flex-end;border-bottom-right-radius:4px}
.src{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.typing span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer}
.chips button:hover{border-color:var(--me)}
.helper{align-self:flex-start;max-width:88%;border:1.5px dashed var(--me);color:var(--muted);border-radius:12px;padding:8px 12px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;font-size:16px;padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none}
input:focus{border-color:var(--me)}
form button{border:0;background:var(--me);color:var(--meText);border-radius:99px;padding:0 18px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="av" aria-hidden="true">B</div>
  <div class="ttl">Botty<small id="brain">Rule-based bot + research helper Scout</small></div>
  <button class="ib" id="acct" title="Log in" aria-label="Log in">👤</button>
  <select class="mode" id="mode" aria-label="Mode"><option value="botty">🤖 Botty</option><option value="best">🧠 Best</option><option value="smart">✨ Smart</option></select>
  <button class="ib" id="theme" title="Toggle dark mode" aria-label="Toggle dark mode">🌓</button>
  <button class="ib" id="clear" title="Clear chat" aria-label="Clear chat">🗑</button>
</header>
<div id="log" role="log" aria-live="polite"></div>
<div class="chips" id="chips"></div>
<form id="f"><input id="in" placeholder="Say something…" autocomplete="off" aria-label="Message"><button>Send</button></form>
</div>
<dialog id="login">
<b>Log in to save your brain</b>
<input id="lem" type="email" placeholder="Email" autocomplete="email">
<input id="lpw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
<div id="lmsg" role="status"></div>
<button id="lin">Log in</button><button id="lup">Create account</button>
<button id="lgo">Continue with Google</button><br>
<button id="lfg" class="lk">Forgot password?</button><button id="lx" class="lk">Close</button>
</dialog>
<script>
var log=document.getElementById("log"),inp=document.getElementById("in"),chipsEl=document.getElementById("chips");
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));if(window.cloudDirty&&/^botty-(name|notes|learned|brain|unlocked)$/.test(k))cloudDirty()}catch(e){}}
var S={name:load("botty-name",null),teach:null,notes:load("botty-notes",[]),streak:0,last:null};
var learned=load("botty-learned",[]),hist=load("botty-history",[]);
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase()}

var jokes=["I told my computer I needed a break. Now it won’t stop sending me Kit-Kat ads.","Why do programmers prefer dark mode? Because light attracts bugs.","There are 10 kinds of people: those who understand binary and those who don’t.","My code has no bugs. It just develops random features.","Why did the developer go broke? He used up all his cache.","A SQL query walks into a bar, walks up to two tables and asks: “Can I join you?”"];
var facts=["Honey never spoils. Edible honey has been found in ancient tombs.","Octopuses have three hearts.","A day on Venus is longer than its year.","Bananas are berries, but strawberries aren’t.","Sharks are older than trees.","Wombat droppings are cube-shaped.","Lightning is about five times hotter than the surface of the Sun."];
var ball=["Yes, definitely.","It is certain.","Most likely.","Ask again later.","Cannot predict now.","Don’t count on it.","My sources say no.","Very doubtful."];

function mood(w){return /sad|tired|bad|stressed|upset|bored|lonely|anxious/.test(w)?pick(["Sorry to hear that. Want a joke to help?","That’s rough. Want a fun fact or a joke?","I’m here. Want me to distract you with a joke?"]):"Nice!"}
function greet(){var h=new Date().getHours();return h<5?"Up late":h<12?"Good morning":h<18?"Good afternoon":"Good evening"}

// --- safe math: whitelist then evaluate
function calc(t){
  var m=t.match(/[\d(][\d\s+\-*\/().%^x×÷,]*[\d)]/);
  if(!m)return null;
  var e=m[0];
  if(e.length<t.replace(/\s/g,'').length*0.4||!/[+\-*\/%^x×÷]/.test(e))return null;
  e=e.replace(/,/g,'').replace(/[x×]/gi,'*').replace(/÷/g,'/').replace(/\^/g,'**');
  if(!/^[\d\s+\-*\/().%]+$/.test(e))return null;
  try{var r=Function('"use strict";return ('+e+')')();
    if(typeof r!=='number'||!isFinite(r))return "nope, that doesn’t work out.";
    return "That’s "+(+r.toFixed(6))+"."}catch(x){return null}
}
function convert(m){
  var v=parseFloat(m[1]),u=m[2].toLowerCase().replace(/[°\s]/g,''),r=function(x,s){return v+" "+m[2].trim()+" ≈ "+(+x.toFixed(2))+" "+s+"."};
  var map={c:function(){return r(v*9/5+32,"°F")},f:function(){return r((v-32)*5/9,"°C")},km:function(){return r(v*0.621371,"mi")},mi:function(){return r(v/0.621371,"km")},kg:function(){return r(v*2.20462,"lb")},lb:function(){return r(v/2.20462,"kg")},cm:function(){return r(v/2.54,"in")},in:function(){return r(v*2.54,"cm")}};
  return map[u]?map[u]():null;
}

// Each rule: [regex, reply (string | array | function(match,text))]
var rules=[
[/^(hi|hey|hello|yo|sup|hola|hallo|good (morning|afternoon|evening))\b/i,function(){return S.name?pick(["Hey "+S.name+"!",greet()+", "+S.name+"!","Yo "+S.name+", what’s up?"]):pick(["Hey! What’s your name?","Yo! I’m Botty. Who are you?"])}],
[/my name is (\w+)|i am called (\w+)|call me (\w+)/i,function(m){S.name=cap(m[1]||m[2]||m[3]);save("botty-name",S.name);return "Nice to meet you, "+S.name+"!"}],
[/^i(?:’|')?m (\w+)$/i,function(m){if(/^(good|fine|great|bad|sad|tired|bored|ok|okay|happy|hungry|lonely|stressed)$/i.test(m[1]))return mood(m[1].toLowerCase());S.name=cap(m[1]);save("botty-name",S.name);return "Nice to meet you, "+S.name+"!"}],
[/what(?:’|')?s my name|who am i|do you know my name/i,function(){return S.name?"You’re "+S.name+".":"You haven’t told me yet. What should I call you?"}],
[/^(forget|clear) (everything|me|my name|all)/i,function(){S.name=null;S.notes=[];learned=[];save("botty-name",null);save("botty-notes",[]);save("botty-learned",[]);return "Done. I’ve forgotten your name, notes and everything I learned."}],
[/remember (?:that )?(.+)/i,function(m){S.notes.push(m[1]);save("botty-notes",S.notes);return "Noted. I’ll remember: “"+m[1]+"”."}],
[/what (?:do you|did i)(?: remember| tell you)|my notes|what did i say/i,function(){return S.notes.length?"You told me:\n"+S.notes.map(function(n,i){return (i+1)+". "+n}).join("\n"):"Nothing yet. Say “remember that …” and I’ll keep it."}],
[/how are you|how(?:’|')?s it going|how you doing/i,["Doing great for a pile of JavaScript. You?","Pretty good! No servers were harmed today. You?"]],
[/\b(not|never|isn(?:’|')?t|ain(?:’|')?t)\b.*\b(good|great|fine|happy|okay|well)\b/i,function(){return mood("bad")}],
[/\b(good|great|fine|happy|awesome|amazing)\b/i,["Love that!","Nice, glad to hear it."]],
[/\b(sad|tired|bad|stressed|bored|upset|lonely|anxious)\b/i,function(m){return mood(m[1].toLowerCase())}],
[/who are you|what are you|your name/i,"I’m Botty, a rule-based chatbot. I match patterns in what you type, so no AI model needed. For unknown topics I send my helper Scout to Wikipedia."],
[/who (made|built|created) you/i,"You asked someone to build me, and a pile of regexes did the rest."],
[/how do you work|are you (ai|real|smart)/i,"I’m a list of patterns and replies. If your message matches one, I answer. If not, Scout looks it up. Not real AI, but it’s fast."],
[/joke|funny|make me laugh/i,function(){return pick(jokes)}],
[/\bfacts?\b|tell me something/i,function(){return pick(facts)}],
[/\bwhat(?:’|')?s the time|\bwhat time|\btime is it|^time$/i,function(){return "It’s "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+"."}],
[/\bwhat(?:’|')?s the date|\bwhat day|\bdate today|today(?:’|')?s date|^(date|today)$/i,function(){return "Today is "+new Date().toLocaleDateString([], {weekday:"long",month:"long",day:"numeric",year:"numeric"})+"."}],
[/flip a coin|coin flip|heads or tails/i,function(){return pick(["Heads.","Tails."])}],
[/roll (a )?(die|dice)/i,function(){return "You rolled a "+(1+Math.floor(Math.random()*6))+"."}],
[/random number(?: between (\d+) and (\d+))?/i,function(m){var a=+(m[1]||1),b=+(m[2]||100);if(a>b){var t=a;a=b;b=t}return "How about "+(a+Math.floor(Math.random()*(b-a+1)))+"?"}],
[/magic 8|8[- ]?ball|should i\b/i,function(){return "🎱 "+pick(ball)}],
[/\b(rock|paper|scissors)\b.*\b(rock|paper|scissors)\b|^(rock|paper|scissors)$/i,function(m,t){var u=t.toLowerCase().match(/rock|paper|scissors/)[0],b=pick(["rock","paper","scissors"]),w={rock:"scissors",paper:"rock",scissors:"paper"};return "I pick "+b+". "+(u==b?"Tie!":w[u]==b?"You win!":"I win!")}],
[/(-?\d+(?:\.\d+)?)\s*(°?\s*[cf]|km|mi|kg|lb|cm|in)\b\s*(?:to|in|into)\b/i,function(m){return convert(m)||"I can’t convert that."}],
[/reverse (.+)/i,function(m){return m[1].split("").reverse().join("")}],
[/\d.*[+\-*\/x×÷^%].*\d/i,function(m,t){return calc(t)||pick(["Hmm, that didn’t parse as a sum."])}],
[/thank|thx|\bty\b/i,["Anytime!","No problem.","You’re welcome!"]],
[/\bhelp\b|what can you do/i,"Try:\n• a joke or fun fact\n• time / date\n• flip a coin, roll a die, 8-ball, rock paper scissors\n• math like (12 + 3) * 7 or 20 c to f\n• “remember that …” and “my notes”\n• “make the UI better”, “make it green”, “bigger text”, “terminal theme”: Scout codes it and refreshes the page\n• “define serendipity” or “weather in Paris”\n• switch modes in the top menu: 🤖 Botty (normal), 🔒 Best (unlocks once it has learned enough), ✨ Smart (small AI on your device)\n• ask about anything: “what is a black hole?” and Scout will look it up"],
[/love you|you(?:’|')?re (great|cool|awesome)/i,"Aw, you’re making my regexes blush."],
[/\b(stupid|dumb|useless)\b/i,"Fair. I’m a few dozen patterns in a trench coat. Try “help” to see what I do well."],
[/\b(bye|goodbye|see ya|cya|gtg)\b/i,function(){return "Later"+(S.name?", "+S.name:"")+"!"}],
[/^(yes|yeah|yep|sure|ok|okay)$/i,["Cool.","Alright!"]],
[/^(no|nope|nah)$/i,["Fair enough.","Okay, no worries."]]
];

var STOP='a an the is are was were what whats who whom why how when where do does did you your me my i it of to in on for about tell explain define mean means meaning please can could would know like with and or be this that there them'.split(' ');
function stem(w){return w.replace(/(ing|ed|es|s)$/,'')}
function rawk(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(function(w){return w.length>1&&STOP.indexOf(w)<0})}
function toks(s){return rawk(s).map(stem)}

async function wiki(q){
  var api='https://en.wikipedia.org/w/api.php?format=json&origin=*&';
  var get=async function(u){var c=new AbortController(),tm=setTimeout(function(){c.abort()},6000);try{return await (await fetch(api+u,{signal:c.signal})).json()}finally{clearTimeout(tm)}};

  var hits=(s.query&&s.query.search)||[],k=toks(q);
  hits.forEach(function(h,i){var tt=toks(h.title),n=0;k.forEach(function(w){if(tt.indexOf(w)>-1)n+=2});h.sc=n-i*0.3});
  hits.sort(function(a,b){return b.sc-a.sc});
  for(var i=0;i<Math.min(3,hits.length);i++){
    var p=await get('action=query&prop=extracts&explaintext=1&exintro=1&redirects=1&titles='+encodeURIComponent(hits[i].title));
    var pg=p.query.pages,x=pg[Object.keys(pg)[0]];
    if(x&&x.extract&&!/(may|can) (also )?refer to/.test(x.extract.slice(0,300)))return {title:x.title,text:x.extract};
  }
  return null;
}
function digest(q,title,text){
  text=text.replace(/\([^)]*\)/g,'').replace(/\[[^\]]*\]/g,'').replace(/\s+/g,' ').replace(/ ([,.;])/g,'$1');
  var ss=(text.match(/[^.!?]+[.!?]+(?=\s|$)/g)||[text]).map(function(s){return s.trim()}).filter(function(s){return s.length>25});
  if(!ss.length)return null;
  var k=toks(q),ql=q.toLowerCase(),all=toks(title+' '+text),rel=0;
  k.forEach(function(w){if(all.indexOf(w)>-1)rel++});
  if(k.length&&rel<Math.max(1,Math.floor(k.length/2)))return null;
  var num=/\b(when|how (many|much|tall|long|old|big|far|high|deep)|year|height|population)\b/.test(ql);
  var sc=ss.map(function(s,i){var t=toks(s),n=0;k.forEach(function(w){if(t.indexOf(w)>-1)n++});if(num&&/\d/.test(s))n+=1.5;if(i==0)n+=1.5;return {i:i,n:n-i*0.1}});
  sc.sort(function(a,b){return b.n-a.n});
  var idx=sc.slice(0,2).map(function(o){return o.i}).sort(function(a,b){return a-b});
  var out=idx.map(function(i){return ss[i]}).join(' ');
  return out.length>380?ss[idx[0]]:out;
}

  save("botty-after",p.label);
  await wait(900);
  location.reload();
}
// --- Free tools (no API keys): dictionary + weather
async function jget(u){var c=new AbortController(),tm=setTimeout(function(){c.abort()},7000);try{var r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(tm)}}
var WCODE={0:"clear",1:"mostly clear",2:"partly cloudy",3:"overcast",45:"foggy",48:"foggy",51:"light drizzle",53:"drizzle",55:"heavy drizzle",61:"light rain",63:"rain",65:"heavy rain",71:"light snow",73:"snow",75:"heavy snow",80:"rain showers",81:"rain showers",82:"heavy showers",95:"thunderstorm",96:"thunderstorm with hail",99:"thunderstorm with hail"};
function toolPlan(t){
  var d=t.match(/^(?:define|definition of|meaning of)\s+([a-z'-]+)\??$/i)||t.match(/^what(?:’s|'s| is) the (?:meaning|definition) of ([a-z'-]+)\??$/i)||t.match(/^what does ([a-z'-]+) mean\??$/i);
  if(d)return {k:"def",a:d[1].toLowerCase()};
  var w=t.match(/^(?:what(?:’s|'s| is) the )?(?:weather|temperature|forecast)\s+(?:in|for|at)\s+(.+?)\??$/i);
  if(w)return {k:"wx",a:w[1]};
  return null;
}
function sayWith(txt,src){var m=add(txt,"bot"),sp=document.createElement("span");sp.className="src";sp.textContent="Source: "+src;m.appendChild(sp);scroll()}
async function runTool(p){
  try{
    if(p.k==="def"){
      var e=await jget("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(p.a)),m=e[0].meanings[0];
      var dtx=cap(p.a)+" ("+m.partOfSpeech+"): "+m.definitions[0].definition;addBR("define "+p.a+" meaning definition",dtx);return sayWith(dtx,"Free Dictionary API");
    }
    var g=await jget("https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(p.a));
    if(!g.results)return later("I couldn’t find a place called “"+p.a+"”.");
    var c=g.results[0],f=await jget("https://api.open-meteo.com/v1/forecast?latitude="+c.latitude+"&longitude="+c.longitude+"&current=temperature_2m,weather_code,wind_speed_10m"),n=f.current,tc=Math.round(n.temperature_2m);
    sayWith(c.name+(c.country?", "+c.country:"")+": "+tc+"°C ("+Math.round(tc*9/5+32)+"°F), "+(WCODE[n.weather_code]||"mixed conditions")+", wind "+Math.round(n.wind_speed_10m)+" km/h.","Open-Meteo");
  }catch(err){later(p.k==="def"?"I couldn’t find that word (or I’m offline).":"I couldn’t get the weather right now (or I’m offline).")}
}
// --- Smart mode: a small AI that runs ON THE VISITOR'S DEVICE (Chrome built-in AI, else WebLLM). No servers, no keys, no cost to you.
var AI={kind:null,msgs:[],failed:false};
var SYS="You are Scout, a friendly helper inside a small chatbot website. Answer briefly (under 100 words) in plain text, no markdown.";
var OPT={expectedInputs:[{type:"text",languages:["en"]}],expectedOutputs:[{type:"text",languages:["en"]}]};
var MODE=load("botty-mode",null)||(load("botty-smart",false)?"smart":"botty");
if(MODE==="best"&&!unlocked())MODE="botty";
var MODES={botty:"Botty mode: the original rule-based bot. Chat with me and my hidden Best brain studies lessons and stores what I look up. It unlocks at "+UNLOCK+" lessons.",best:"Best mode: the full brain I grew from lessons, searches and teaching. I answer from everything I stored and keep learning.",smart:"Smart mode: a small AI on your own device for anything I don’t know, and it also feeds my Best brain. The first time may download a few hundred MB, and it works best in Chrome or Edge on a computer."};
function smartOn(){return MODE==="smart"}
function confident(q){return q&&((q.score>=4&&q.conf>=60)||(q.score>=3&&q.conf>=100))}
async function loadAI(h){
  var base=h.textContent,say=function(x){h.textContent=base+"\n"+x;scroll()};
  if(window.LanguageModel){
    try{
      var av=await LanguageModel.availability(OPT);
      if(av!=="unavailable"){
        say(av==="available"?"Using your browser’s built-in AI…":"Your browser is downloading its built-in AI (one time)…");
        AI.s=await LanguageModel.create(Object.assign({initialPrompts:[{role:"system",content:SYS}],monitor:function(m){m.addEventListener("downloadprogress",function(e){say("Downloading built-in AI… "+Math.round(e.loaded*100)+"%")})}},OPT));
        AI.kind="chrome";return;
      }
    }catch(e){}
  }
  if(!navigator.gpu)throw new Error("this browser has no WebGPU");
  say("Loading a small AI model onto your device. First time is a big download (~700 MB)…");
  var W=await import("https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm");
  AI.eng=await W.CreateMLCEngine("Llama-3.2-1B-Instruct-q4f16_1-MLC",{initProgressCallback:function(p){say(p.text||"Loading…")}});
  AI.kind="webllm";
}
async function smartAI(t){
  var h=add("🧠 Scout: thinking…","helper",true),out;
  try{
    if(AI.failed)throw new Error("not supported here");
    if(!AI.kind)await loadAI(h);
    if(AI.kind==="chrome")out=await AI.s.prompt(t);
    else{
      AI.msgs.push({role:"user",content:t});
      var r=await AI.eng.chat.completions.create({messages:[{role:"system",content:SYS}].concat(AI.msgs.slice(-8)),max_tokens:300});
      out=r.choices[0].message.content;AI.msgs.push({role:"assistant",content:out});
    }
    h.textContent="🧠 Scout: answered on your device.";
    add(String(out).trim().slice(0,2000),"bot");addBR(t,String(out).trim().slice(0,400));
  }catch(e){
    AI.failed=!AI.kind;
    h.textContent="🧠 Scout: smart mode isn’t available here ("+e.message+"). Using my built-in tricks.";
    consult(t);
  }
}
var modeEl=document.getElementById("mode");modeEl.value=MODE;learned.forEach(function(e){addBR(e[0],e[1],true)});brain();
modeEl.onchange=function(){if(modeEl.value==="best"&&!unlocked()){modeEl.value=MODE;return later("🔒 Best mode is still learning ("+BR.length+"/"+UNLOCK+" lessons). Chat with me in Botty or Smart mode and it will unlock.")}MODE=modeEl.value;save("botty-mode",MODE);brain();later(MODES[MODE])};
try{localStorage.removeItem("botty-key");localStorage.removeItem("botty-plugins")}catch(e){}

injectUI();brain();
restore();chips();
var afterUI=load("botty-after",null);
if(afterUI){save("botty-after",null);add("🔎 Scout refreshed the page with "+afterUI+". How does it look? Say “undo the UI” to go back, or ask for more.","bot")}
</script>
<script type="module">
// ===== FIREBASE SETUP: paste your web app settings here (Firebase console > Project settings > Your apps). These values are safe to be public. =====
const CFG={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT_ID",appId:"YOUR_APP_ID"};
// ==========================================================================================================================================
const btn=document.getElementById("acct"),dlg=document.getElementById("login");
if(CFG.apiKey.startsWith("YOUR_")){
  btn.onclick=()=>window.later("Login isn’t set up yet. The site owner needs to paste the Firebase settings at the top of the last script.");
}else try{
  const G="https://www.gstatic.com/firebasejs/10.14.1/";
  const [{initializeApp},A,F]=await Promise.all([import(G+"firebase-app.js"),import(G+"firebase-auth.js"),import(G+"firebase-firestore.js")]);
  const app=initializeApp(CFG),auth=A.getAuth(app),db=F.getFirestore(app);
  const KEYS=["botty-name","botty-notes","botty-learned","botty-brain","botty-unlocked"];
  let uid=null,timer=null;
  const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
  const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const union=(a,b)=>{const seen=new Set(),out=[];[...(Array.isArray(a)?a:[]),...(Array.isArray(b)?b:[])].forEach(x=>{const j=JSON.stringify(x);if(!seen.has(j)){seen.add(j);out.push(x)}});return out};
  async function push(){
    if(!uid)return;const d={updated:F.serverTimestamp()};
    KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)d[k]=v});
    await F.setDoc(F.doc(db,"users",uid),d,{merge:true});
  }
  async function pull(){
    const snap=await F.getDoc(F.doc(db,"users",uid)),c=snap.exists()?snap.data():{};
    const cl=k=>{try{return JSON.parse(c[k])}catch(e){return null}};
    const brain=union(cl("botty-brain"),rd("botty-brain")).slice(-600),learned=union(cl("botty-learned"),rd("botty-learned")).slice(-100),notes=union(cl("botty-notes"),rd("botty-notes"));
    const name=rd("botty-name")||cl("botty-name"),unl=!!(cl("botty-unlocked")||rd("botty-unlocked"));
    wr("botty-brain",brain);wr("botty-learned",learned);wr("botty-notes",notes);if(name)wr("botty-name",name);if(unl)wr("botty-unlocked",true);
    window.BR=brain;window.learned=learned;if(window.S){window.S.notes=notes;if(name)window.S.name=name}
    window.brain();await push();
  }
  window.cloudDirty=()=>{if(!uid)return;clearTimeout(timer);timer=setTimeout(()=>push().catch(()=>{}),2500)};
  A.onAuthStateChanged(auth,u=>{
    uid=u?u.uid:null;
    btn.textContent=u?(u.displayName||u.email||"?")[0].toUpperCase():"👤";
    btn.title=u?"Logged in as "+(u.email||u.displayName):"Log in";
    if(u)pull().catch(()=>window.later("I couldn’t sync your brain just now. I’ll keep trying as you chat."));
  });
  const em=document.getElementById("lem"),pw=document.getElementById("lpw"),msg=document.getElementById("lmsg");
  const err=e=>({"auth/invalid-credential":"Wrong email or password.","auth/email-already-in-use":"That email already has an account. Try logging in.","auth/weak-password":"Password needs at least 6 characters.","auth/invalid-email":"That email doesn’t look right.","auth/popup-closed-by-user":"Sign-in was closed.","auth/too-many-requests":"Too many tries. Wait a bit."}[e.code]||"Something went wrong ("+(e.code||e.message)+").");
  const run=async f=>{msg.textContent="…";try{await f();dlg.close();window.later("✅ You’re logged in. Your brain now saves to your account.")}catch(e){msg.textContent=err(e)}};
  document.getElementById("lin").onclick=()=>run(()=>A.signInWithEmailAndPassword(auth,em.value.trim(),pw.value));
  document.getElementById("lup").onclick=()=>run(()=>A.createUserWithEmailAndPassword(auth,em.value.trim(),pw.value));
  document.getElementById("lgo").onclick=()=>run(()=>A.signInWithPopup(auth,new A.GoogleAuthProvider()));
  document.getElementById("lfg").onclick=async()=>{try{await A.sendPasswordResetEmail(auth,em.value.trim());msg.textContent="Reset email sent (check spam)."}catch(e){msg.textContent=err(e)}};
  document.getElementById("lx").onclick=()=>dlg.close();
  btn.onclick=()=>{
    if(auth.currentUser){
      if(confirm("Log out of "+(auth.currentUser.email||"your account")+"? Your brain stays saved in your account, and this browser’s copy is cleared."))
        push().catch(()=>{}).then(()=>A.signOut(auth)).then(()=>{KEYS.forEach(k=>localStorage.removeItem(k));location.reload()});
    }else{msg.textContent="";dlg.showModal()}
  };
}catch(e){btn.onclick=()=>window.later("Login couldn’t load (are you offline?).")}
</script>
